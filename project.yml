name: Alikhan
options:
  bundleIdPrefix: kz.ersultan
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Alikhan:
    type: application
    platform: iOS
    sources:
      - Alikhan
      - Shared
    dependencies:
      - target: AlikhanWidget
    scheme: {}
    entitlements:
      path: Alikhan/Alikhan.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.ersultan.alikhan
        PRODUCT_NAME: Alikhan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Алихан
    info:
      path: Alikhan/Info.plist
      properties:
        CFBundleDisplayName: Алихан
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [audio, remote-notification]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Алихан сіздің сөзіңізді тыңдап, серверге жібереді.
        NSContactsUsageDescription: «Анама қоңырау шал» десеңіз, Алихан нөмірді контактілерден табады.
        NSRemindersFullAccessUsageDescription: Алихан еске салуларды «Алихан» тізіміне қосады.
        NSRemindersUsageDescription: Алихан еске салуларды «Алихан» тізіміне қосады.
        NSCameraUsageDescription: Тапсырма үшін видео не фото түсіру.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: kz.ersultan.alikhan
            CFBundleURLSchemes: [alikhan]
        LSApplicationQueriesSchemes: [shortcuts, tel, yandexmusic]
  AlikhanWidget:
    type: app-extension
    platform: iOS
    sources:
      - AlikhanWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.ersultan.alikhan.widget
        PRODUCT_NAME: AlikhanWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: AlikhanWidget/Info.plist
      properties:
        CFBundleDisplayName: Алихан
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
